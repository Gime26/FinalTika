{% extends 'base.html' %}
{% block content %}
<div class="login-container">
    <h2>Restablecer contraseña</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.new_password1.label_tag }}
        {{ form.new_password1 }}
        {{ form.new_password2.label_tag }}
        {{ form.new_password2 }}
        <button type="submit" class="btn-guardar">Cambiar contraseña</button>
    </form>
</div>
{% endblock %}
