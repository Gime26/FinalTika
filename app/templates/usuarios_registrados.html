{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-users"></i> Derivar entrevista a un especialista</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="especialista_id" class="form-label">Selecciona un especialista:</label>
            <select name="especialista_id" id="especialista_id" class="form-select" required>
                <option value="">-- Selecciona --</option>
                {% for esp in especialistas %}
                <option value="{{ esp.id }}">{{ esp.nombre }} - {{ esp.especialidad }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Derivar</button>
    </form>
    {% if mensaje %}
    <div class="alert alert-success mt-3">
        <i class="fas fa-check-circle"></i> {{ mensaje }}
    </div>
    {% endif %}
</div>
{% endblock %}
